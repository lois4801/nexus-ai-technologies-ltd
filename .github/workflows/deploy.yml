name: Build and deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    env:
      ASSET_HERO: 'https://www.kimi.com/apiv2-files/sign-obj/kimi-fs%2Ffiles%2Fblob%2Fa3f446b883487a4d01d0b238818ccddfbf2303d75a3c9e96c956ae351a2c1bf1?filename=hero-bg.jpg&sig=cuUBSrfR4hYc6RkG4J-Ql80AAfPbXzfQJbcnsolKEZc=&t=o'
      ASSET_PROBLEM: 'https://www.kimi.com/apiv2-files/sign-obj/kimi-fs%2Ffiles%2Fblob%2F5ae6841b457894328149602495a98ddb137d257d504484df1d3e8f981068fb4f?filename=problem.jpg&sig=FTClg5cQg8e5G4hGMBdZ6w-7fFZIsQ8_C5YaCLPEeOw=&t=o'
      ASSET_PLATFORM: 'https://www.kimi.com/apiv2-files/sign-obj/kimi-fs%2Ffiles%2Fblob%2F05fbadae313de8a7e2f6f250ca44f7a2df23cc53caa718830e5b9be322d251a3?filename=platform.jpg&sig=1TdTPeWRv-3qJwvh4tZCJG6DsrNbK2MwED66EmC7RwQ=&t=o'
      ASSET_CTA: 'https://www.kimi.com/apiv2-files/sign-obj/kimi-fs%2Ffiles%2Fblob%2F9bc2b41acd493e3165e43cbbd77aaf4fc58fcf32dbd9211d594e01666cde9f1e?filename=cta.jpg&sig=136opZYVwe3ZQDHjeOIbgnr67S9i2sFpQH4FjsqcunM=&t=o'
      ASSET_PDF: 'https://www.kimi.com/apiv2-files/sign-obj/kimi-fs%2Ffiles%2Fblob%2F04980e7e7ba9654525f18130c5cb1764984dc395aa90469e6872e23e6e102fb1?filename=nexus-ai-business-plan.pdf&sig=kxsg9BKKb41sHfPprZdTfkgb1kDLwh2ihCCztgVXAQ4=&t=o'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - name: Fetch 4K imagery and business plan PDF
        run: |
          set -euo pipefail
          mkdir -p public/img
          curl -fSL --retry 3 -o public/img/hero-bg.jpg "$ASSET_HERO"
          curl -fSL --retry 3 -o public/img/problem.jpg "$ASSET_PROBLEM"
          curl -fSL --retry 3 -o public/img/platform.jpg "$ASSET_PLATFORM"
          curl -fSL --retry 3 -o public/img/cta.jpg "$ASSET_CTA"
          curl -fSL --retry 3 -o public/nexus-ai-business-plan.pdf "$ASSET_PDF"
      - run: npm run build
      - name: Deploy dist to gh-pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          force_orphan: true
